<style>
  :root {
    --kepco-blue: #004097;
    --kepco-blue-deep: #002d6b;
    --kepco-sky: #00A3E0;
    --kepco-yellow: #FFB71B;
    --ink: #0d1826;
    --ink-2: #3a4a60;
    --paper: #F6F8FB;
    --line: #E5EAF2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EEF1F6; font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  body { padding: 32px 0 80px; }
  .page-head { max-width: 1140px; margin: 0 auto 28px; padding: 0 24px; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap;}
  .page-head h1 { font-size: 26px; font-weight: 800; margin: 0; letter-spacing: -0.02em; }
  .page-head p { margin: 4px 0 0; color: #6b7a90; font-size: 14px;}
  .style-picker { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px; }
  .style-picker button { border: none; background: transparent; padding: 8px 14px; font-family: inherit; font-weight: 600; font-size: 13px; color: #6b7a90; border-radius: 999px; cursor: pointer;}
  .style-picker button.active { background: var(--ink); color: #fff; }
  .grid { max-width: 1140px; margin: 0 auto; padding: 0 24px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 28px; }
  @media (max-width: 860px) { .grid { grid-template-columns: 1fr; } }
  .card-wrap { display: flex; flex-direction: column; align-items: center; }
  .card-num { font-size: 12px; font-weight: 700; color: #8a99b1; margin-bottom: 10px; letter-spacing: 0.08em; }
  .card { width: 540px; max-width: 100%; aspect-ratio: 1080 / 1350; border-radius: 24px; overflow: hidden; position: relative; box-shadow: 0 20px 60px rgba(10, 30, 70, 0.12), 0 2px 8px rgba(10, 30, 70, 0.06); }
  .card-inner { position: absolute; inset: 0; transform-origin: top left; }

  /* ===== Viewer mode (one card at a time) ===== */
  .view-mode-toggle { display: inline-flex; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 4px; gap: 2px; margin-left: 10px; }
  .view-mode-toggle button { border: none; background: transparent; padding: 8px 14px; font-family: inherit; font-weight: 600; font-size: 13px; color: #6b7a90; border-radius: 999px; cursor: pointer;}
  .view-mode-toggle button.active { background: var(--ink); color: #fff; }

  .viewer { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; z-index: 10; }
  .viewer-card-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; max-height: 100%; }
  .viewer .card { height: min(calc(100vh - 40px), calc((100vw - 200px) * 1.25)); width: calc(min(calc(100vh - 40px), calc((100vw - 200px) * 1.25)) * 0.8); max-width: calc(100vw - 160px); }
  .viewer-meta { display: none; }

  .fs-btn { background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border: none; padding: 10px 14px; border-radius: 999px; cursor: pointer; font-weight: 700; font-size: 13px; color: #0d1826; box-shadow: 0 2px 12px rgba(10,30,70,0.08); display: inline-flex; align-items: center; gap: 6px;}

  .nav-btn { position: fixed; top: 50%; transform: translateY(-50%); width: 56px; height: 56px; border-radius: 50%; border: none; background: #fff; box-shadow: 0 4px 20px rgba(10,30,70,0.15); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #0d1826; z-index: 20; transition: all 0.2s;}
  .nav-btn:hover:not(:disabled) { transform: translateY(-50%) scale(1.08); box-shadow: 0 6px 28px rgba(10,30,70,0.22);}
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .nav-btn.prev { left: 24px; }
  .nav-btn.next { right: 24px; }

  .dots { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 20; padding: 10px 14px; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); border-radius: 999px; box-shadow: 0 4px 20px rgba(10,30,70,0.1); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #CBD3E0; border: none; cursor: pointer; padding: 0; transition: all 0.2s; }
  .dot.active { background: var(--ink); width: 28px; border-radius: 5px; }
  .dot:hover { background: #8a99b1; }

  .counter { position: fixed; top: 24px; right: 24px; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); padding: 10px 16px; border-radius: 999px; font-weight: 700; font-size: 14px; color: #0d1826; z-index: 20; box-shadow: 0 2px 12px rgba(10,30,70,0.08);}

  .viewer-head { position: fixed; top: 24px; left: 24px; display: flex; gap: 10px; align-items: center; z-index: 20; }

<body>

<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

/* =====================================================================
   TWEAKS — persisted defaults
   ===================================================================== */
const TWEAKS = /*EDITMODE-BEGIN*/{
  "style": "official",
  "showBadges": true
}/*EDITMODE-END*/;

/* =====================================================================
   STYLE TOKENS — 3 variants
   ===================================================================== */
const STYLES = {
  official: {
    name: '한전 공식',
    bg: '#F2F5FA',
    surface: '#FFFFFF',
    ink: '#0d1826',
    ink2: '#3a4a60',
    accent: '#004097',
    accentDeep: '#002d6b',
    sky: '#00A3E0',
    yellow: '#FFB71B',
    coverBg: 'linear-gradient(160deg, #004097 0%, #002d6b 100%)',
    coverInk: '#fff',
    radius: 20,
    displayFont: "'Pretendard Variable', sans-serif",
    bodyFont: "'Pretendard Variable', sans-serif",
    bubble: '#EEF3FB',
    ai: '#004097',
    korName: '한전 공식',
  },
  friendly: {
    name: '친근 일러스트',
    bg: '#FFF9EE',
    surface: '#FFFFFF',
    ink: '#2A2330',
    ink2: '#5d5269',
    accent: '#FF7A59',
    accentDeep: '#E04E2A',
    sky: '#4AB8E6',
    yellow: '#FFC939',
    coverBg: 'linear-gradient(170deg, #FFB866 0%, #FF7A59 55%, #E04E2A 100%)',
    coverInk: '#fff',
    radius: 28,
    displayFont: "'Pretendard Variable', sans-serif",
    bodyFont: "'Pretendard Variable', sans-serif",
    bubble: '#FFF1E4',
    ai: '#E04E2A',
    korName: '친근 일러스트',
  },
  mz: {
    name: 'MZ 미래감',
    bg: '#0A0B18',
    surface: '#14162A',
    ink: '#F2F4FF',
    ink2: '#A6AEC8',
    accent: '#7B5CFF',
    accentDeep: '#5436D1',
    sky: '#3DE1FF',
    yellow: '#E6FF4F',
    coverBg: 'radial-gradient(110% 85% at 20% 10%, #7B5CFF 0%, #2D1A7A 45%, #05061A 100%)',
    coverInk: '#fff',
    radius: 22,
    displayFont: "'Pretendard Variable', sans-serif",
    bodyFont: "'Pretendard Variable', sans-serif",
    bubble: '#1D2040',
    ai: '#3DE1FF',
    korName: 'MZ 미래감',
  },
};

/* =====================================================================
   CARD — 1080x1350 canvas, auto-scaled into 540w wrapper
   ===================================================================== */
function Card({ children, bg, tone = 'light' }) {
  const ref = useRef(null);
  const innerRef = useRef(null);
  useEffect(() => {
    function fit() {
      if (!ref.current || !innerRef.current) return;
      const w = ref.current.clientWidth;
      const s = w / 1080;
      innerRef.current.style.width = '1080px';
      innerRef.current.style.height = '1350px';
      innerRef.current.style.transform = `scale(${s})`;
    }
    fit();
    const ro = new ResizeObserver(fit);
    ro.observe(ref.current);
    return () => ro.disconnect();
  }, []);
  return (
    <div ref={ref} className="card" style={{ background: bg }}>
      <div ref={innerRef} className="card-inner" style={{ color: tone === 'dark' ? '#fff' : 'inherit' }}>
        {children}
      </div>
    </div>
  );
}

function CardShell({ children, s, tone = 'light', bg }) {
  return <Card bg={bg || s.bg} tone={tone}>{children}</Card>;
}

/* Small building blocks used inside 1080-px cards */
function Chip({ children, color, bg, s }) {
  return <span style={{
    display: 'inline-flex', alignItems: 'center', gap: 10,
    padding: '10px 22px', borderRadius: 999,
    background: bg || 'rgba(255,255,255,0.14)',
    color: color || s.coverInk,
    fontWeight: 700, fontSize: 26, letterSpacing: '-0.01em',
  }}>{children}</span>;
}

function Dot({ color = '#fff', size = 10 }) {
  return <span style={{ width: size, height: size, borderRadius: '50%', background: color, display: 'inline-block' }}/>;
}

/* =====================================================================
   CARD 1 — Cover
   ===================================================================== */
function Card1Cover({ s }) {
  return (
    <CardShell s={s} tone="dark" bg={s.coverBg}>
      <div style={{ padding: 80, height: '100%', display: 'flex', flexDirection: 'column', justifyContent: 'space-between', color: s.coverInk, fontFamily: s.bodyFont }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <div style={{ width: 54, height: 54, borderRadius: 14, background: 'rgba(255,255,255,0.18)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 900, fontSize: 24, letterSpacing: '-0.02em' }}>K</div>
          <div>
            <div style={{ fontSize: 22, fontWeight: 700, opacity: 0.9 }}>한국전력공사</div>
            <div style={{ fontSize: 18, opacity: 0.6 }}>AI 활용 가이드 · 2026</div>
          </div>
        </div>

        <div>
          <div style={{ fontSize: 30, fontWeight: 600, opacity: 0.8, marginBottom: 24, letterSpacing: '0.02em' }}>
            사무실부터 현장까지, 모든 한전인을 위한
          </div>
          <div style={{ fontSize: 120, fontWeight: 900, lineHeight: 1.0, letterSpacing: '-0.04em', fontFamily: s.displayFont }}>
            AI,<br/>
            <span style={{ color: s.yellow }}>진짜</span> 쉽습니다.
          </div>
          <div style={{ fontSize: 34, fontWeight: 500, opacity: 0.82, marginTop: 36, lineHeight: 1.45 }}>
            카톡 보낼 줄 알면 AI도 씁니다.<br/>
            10장이면 충분해요.
          </div>
        </div>

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
          <div style={{ display: 'flex', gap: 12 }}>
            <Chip s={s}>보고서 작성</Chip>
            <Chip s={s}>학습에 활용</Chip>
            <Chip s={s}>바이브 코딩</Chip>
          </div>
          <div style={{ fontSize: 22, opacity: 0.6, textAlign: 'right' }}>
            👉 넘겨보기<br/>
            <span style={{ fontSize: 18 }}>01 / 11</span>
          </div>
        </div>
      </div>
    </CardShell>
  );
}

/* =====================================================================
   CARD 2 — 오해 1: 보안
   ===================================================================== */
function Card2Security({ s }) {
  return (
    <CardShell s={s}>
      <div style={{ padding: 80, height: '100%', display: 'flex', flexDirection: 'column', fontFamily: s.bodyFont, color: s.ink }}>
        <MythHeader n="01" title="보안 때문에 못 써요?" s={s}/>

        <div style={{ fontSize: 72, fontWeight: 900, lineHeight: 1.05, letterSpacing: '-0.04em', marginTop: 40, fontFamily: s.displayFont }}>
          쓸 수 있습니다.<br/>
          <span style={{ color: s.accent }}>이 두 가지</span>를 참고해주세요.
        </div>

        <div style={{ marginTop: 40, display: 'flex', flexDirection: 'column', gap: 20 }}>
          <SecurityRow s={s} n="1" title="민감 정보는 마스킹해서 입력" desc={'실제 이름·고객번호·위치 → "A씨, 1234지점"으로 바꿔서 질문'} />
          <SecurityRow s={s} n="2" title="AI모델 학습 허용관련 설정 OFF 하기" desc={<>
            우측 상단 <b>프로필 아이콘 → Settings</b> 클릭<br/>
            <span style={{fontSize: 22}}>· ChatGPT: <b>Data controls → "Improve for everyone" OFF + "Memory" OFF</b></span><br/>
            <span style={{fontSize: 22}}>· Claude: <b>Privacy → "Help improve Claude" OFF</b></span><br/>
            <span style={{fontSize: 22}}>· Gemini: <b>활동 → "Gemini 앱 활동" OFF</b></span>
          </>} tag="국정원 권고" />
        </div>

        <div style={{ marginTop: 'auto', padding: '26px 32px', background: s.accent + '12', borderRadius: 20, display: 'flex', gap: 20, alignItems: 'center' }}>
          <div style={{ fontSize: 40 }}>💡</div>
          <div style={{ fontSize: 24, color: s.ink2, lineHeight: 1.5, fontWeight: 500 }}>
            한전 업무에 AI를 사용한다고 <b style={{color: s.ink}}>무조건 보안 위반이 아닙니다.</b><br/>
            "누구인지 특정 안 되게" 만들고 입력하면 OK.
          </div>
        </div>

        <div style={{ marginTop: 14, padding: '18px 24px', background: '#FFF4E6', borderRadius: 16, border: '2px solid #FFB71B', display: 'flex', gap: 14, alignItems: 'center' }}>
          <div style={{ fontSize: 32 }}>⚠️</div>
          <div style={{ fontSize: 20, color: '#7A4A00', lineHeight: 1.5, fontWeight: 600 }}>
            그래도 <b style={{color: '#B8540A'}}>개인정보·민감정보·대외비 자료</b>는 절대 그대로 입력 금지.<br/>
            <span style={{fontSize: 18, fontWeight: 500}}>의심되면 "이거 넣어도 되나?" 먼저 고민 → 마스킹 후 입력.</span>
          </div>
        </div>
      </div>
    </CardShell>
  );
}

function MythHeader({ n, title, s }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 20 }}>
      <div style={{ padding: '6px 18px', background: s.accent, color: '#fff', borderRadius: 999, fontWeight: 800, fontSize: 22, letterSpacing: '0.05em' }}>MYTH · {n}</div>
      <div style={{ fontSize: 30, color: s.ink2, fontWeight: 600 }}>"{title}"</div>
    </div>
  );
}

function SecurityRow({ s, n, title, desc, tag }) {
  return (
    <div style={{ display: 'flex', gap: 20, alignItems: 'flex-start' }}>
      <div style={{ flexShrink: 0, width: 60, height: 60, borderRadius: 16, background: s.accent, color: '#fff', fontWeight: 900, fontSize: 30, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: s.displayFont }}>{n}</div>
      <div style={{ flex: 1 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}>
          <div style={{ fontSize: 34, fontWeight: 800, letterSpacing: '-0.02em' }}>{title}</div>
          {tag && <div style={{ padding: '3px 12px', background: s.yellow, color: s.ink, borderRadius: 8, fontWeight: 800, fontSize: 17 }}>{tag}</div>}
        </div>
        <div style={{ fontSize: 24, color: s.ink2, marginTop: 8, lineHeight: 1.55, fontWeight: 500 }}>{desc}</div>
      </div>
    </div>
  );
}

/* =====================================================================
   CARD 3 — 오해 2: 사무직만 쓰는 거 아닌가요?
   ===================================================================== */
function Card3Scope({ s }) {
  return (
    <CardShell s={s}>
      <div style={{ padding: 72, height: '100%', display: 'flex', flexDirection: 'column', fontFamily: s.bodyFont, color: s.ink }}>
        <MythHeader n="02" title="책상 앞 사람들만 쓰는 거죠?" s={s}/>

        <div style={{ fontSize: 66, fontWeight: 900, lineHeight: 1.05, letterSpacing: '-0.04em', marginTop: 32, fontFamily: s.displayFont }}>
          <span style={{ color: s.accent }}>문서·숫자·용어</span>가<br/>
          있는 모든 일에.
        </div>

        <div style={{ marginTop: 28, fontSize: 24, color: s.ink2, lineHeight: 1.55, fontWeight: 500 }}>
          현장도, 사무실도 — 한전의 업무는 결국 <b style={{color: s.ink}}>보고서·매뉴얼·응대·숫자로 이루어집니다.</b>
        </div>

        <div style={{ marginTop: 28, flex: 1, display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 12 }}>
          <ScopeCase s={s} icon="⚡" role="송변전·배전" ex={<><b>고장 원인 분석</b><br/>로그·데이터 패턴 정리</>}/>
          <ScopeCase s={s} icon="🏗️" role="건설" ex={<><b>공사 일정·자재 정리</b><br/>공정표 초안 요약</>}/>
          <ScopeCase s={s} icon="💻" role="ICT" ex={<><b>로그·에러 원인 분석</b><br/>코드 작성·리뷰</>}/>
          <ScopeCase s={s} icon="📋" role="사무" ex={<><b>엑셀 집계·VLOOKUP</b><br/>수식 한 줄로 끝</>}/>
          <ScopeCase s={s} icon="📝" role="보고서" ex={<><b>기안서·품의서</b><br/>초안 20분 컷</>}/>
          <ScopeCase s={s} icon="📧" role="커뮤니케이션" ex={<><b>메일·공문 다듬기</b><br/>톤·문장 교정</>}/>
        </div>

        <div style={{ marginTop: 22, padding: '20px 24px', background: s.surface, borderRadius: 16, border: `2px solid ${s.accent}22`, display: 'flex', gap: 14, alignItems: 'center' }}>
          <div style={{ fontSize: 34 }}>💡</div>
          <div style={{ fontSize: 22, fontWeight: 600, color: s.ink2, lineHeight: 1.5 }}>
            망치가 목수를 대체하지 않듯, <b style={{color: s.accent}}>AI는 당신을 대체하지 않습니다.</b><br/>
            <span style={{fontSize: 20}}>반복·귀찮은 일을 맡기고, 사람은 판단·현장에 집중.</span>
          </div>
        </div>
      </div>
    </CardShell>
  );
}

function ScopeCase({ s, icon, role, ex }) {
  return (
    <div style={{ padding: 18, background: s.surface, borderRadius: 14, border: `2px solid ${s.line || '#E5EAF2'}`, display: 'flex', flexDirection: 'column', gap: 6 }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <div style={{ fontSize: 26 }}>{icon}</div>
        <div style={{ padding: '2px 10px', background: s.accent, color: '#fff', borderRadius: 7, fontWeight: 800, fontSize: 16, letterSpacing: '0.04em' }}>{role}</div>
      </div>
      <div style={{ fontSize: 19, color: s.ink, fontWeight: 500, lineHeight: 1.4 }}>{ex}</div>
    </div>
  );
}

function StatBox({ s, big, small, highlight }) {
  return (
    <div style={{
      padding: 32, borderRadius: 20,
      background: highlight ? s.accent : s.surface,
      color: highlight ? '#fff' : s.ink,
      border: highlight ? 'none' : `2px solid ${s.line || '#E5EAF2'}`,
    }}>
      <div style={{ fontSize: 26, opacity: 0.8, fontWeight: 600, marginBottom: 8 }}>{small}</div>
      <div style={{ fontSize: 78, fontWeight: 900, letterSpacing: '-0.04em', fontFamily: s.displayFont, lineHeight: 1 }}>{big}</div>
    </div>
  );
}

/* =====================================================================
   CARD 4 — 오해 3: IT 전문가
   ===================================================================== */
function Card4Expert({ s }) {
  return (
    <CardShell s={s}>
      <div style={{ padding: 80, height: '100%', display: 'flex', flexDirection: 'column', fontFamily: s.bodyFont, color: s.ink }}>

function BeforeAfter({ s, pos, setPos }) {
  const boxH = 420;
  return (
    <div style={{ marginTop: 32, position: 'relative', height: boxH, borderRadius: 22, overflow: 'hidden', border: `2px solid ${s.line || '#E5EAF2'}`, background: s.surface, userSelect: 'none', cursor: 'ew-resize' }}
      onMouseDown={(e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const move = (ev) => setPos(Math.max(3, Math.min(97, ((ev.clientX - rect.left) / rect.width) * 100)));
        const up = () => { window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up); };
        window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
        move(e);
      }}
      onTouchMove={(e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const t = e.touches[0];
        setPos(Math.max(3, Math.min(97, ((t.clientX - rect.left) / rect.width) * 100)));
      }}
    >
      {/* AFTER (below) */}
      <div style={{ position: 'absolute', inset: 0, padding: 32, display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>

          <span style={{ color: s.accent }}>누가 썼을까요?</span>
        </div>

        <div style={{ marginTop: 40, display: 'flex', flexDirection: 'column', gap: 20, flex: 1 }}>
          <QuizOption s={s} letter="A" pick={pick} setPick={setPick} correct={correct}
            text={'"고객님, 불편을 드려 진심으로 죄송합니다. 말씀하신 정전 상황은 해당 지역 변압기 점검으로 인한 것으로 확인되며, 복구 예상 시각은 17:30입니다. 보상 절차에 대해서는 추가 안내 드리겠습니다."'}
          />
          <QuizOption s={s} letter="B" pick={pick} setPick={setPick} correct={correct}
            text={'"확인 결과 해당 지역 정전은 예정된 변압기 점검 때문이었습니다. 17시 30분쯤 복구 예정이고, 보상 건은 저희 쪽에서 다시 연락드릴게요. 놀라셨을 텐데 죄송합니다."'}
          />
        </div>

        {pick && (
          <div style={{ marginTop: 24, padding: 24, background: s.accent + '14', borderRadius: 18, fontSize: 26, lineHeight: 1.5, fontWeight: 600, color: s.ink }}>
            {pick === correct ? '정답! 🎉 ' : '땡! ❌ '}
            <b>A가 AI 초안, B가 선배가 다듬은 최종본</b>입니다.<br/>
            <span style={{ color: s.ink2, fontSize: 22, fontWeight: 500 }}>→ AI 초안 + 사람의 다듬기, 이 조합이 정답입니다.</span>
          </div>
        )}
      </div>
    </CardShell>
  );
}

function QuizOption({ s, letter, text, pick, setPick, correct }) {
  const picked = pick === letter;
  const revealed = pick !== null;
  const isCorrect = letter === correct;
  const border = !revealed ? s.line || '#E5EAF2'
    : picked && isCorrect ? '#2CBB5D'
    : picked && !isCorrect ? '#C83333'
    : isCorrect ? '#2CBB5D' : s.line || '#E5EAF2';
  return (
    <button onClick={() => setPick(letter)} style={{
      display: 'flex', gap: 20, alignItems: 'flex-start', textAlign: 'left',
      padding: 28, background: s.surface, border: `3px solid ${border}`, borderRadius: 20,
      cursor: pick ? 'default' : 'pointer', fontFamily: 'inherit', flex: 1,
      transform: picked ? 'scale(1.02)' : 'none', transition: 'all 0.2s',
    }}>
      <div style={{ flexShrink: 0, width: 56, height: 56, borderRadius: 14, background: picked ? s.accent : s.bubble, color: picked ? '#fff' : s.ink, fontWeight: 900, fontSize: 28, display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: s.displayFont }}>{letter}</div>
      <div style={{ fontSize: 24, lineHeight: 1.55, color: s.ink, fontWeight: 500 }}>{text}</div>
    </button>
  );
}

/* =====================================================================
   ROOT APP
   ===================================================================== */
const CARDS = [
  { n: '01 · 표지', C: Card1Cover },
  { n: '02 · 오해 보안', C: Card2Security },
  { n: '03 · 사무+기술 모두', C: Card3Scope },
  { n: '04 · 오해 전문가', C: Card4Expert },
  { n: '05 · 엑셀 (Before/After)', C: Card5Excel, interactive: true },
  { n: '06 · 전력 전문 질문', C: Card6Power, interactive: true },
  { n: '07 · VBA 망분리', C: Card7Macro },
  { n: '08 · 바이브 코딩', C: Card8Vibe },
  { n: '09 · 퀴즈', C: Card8Quiz, interactive: true },
  { n: '10 · 직무별 추천', C: Card9Roles, interactive: true },
  { n: '11 · CTA', C: Card10CTA },
];

function App() {
  const [styleKey, setStyleKey] = useState(TWEAKS.style);
  const [viewMode, setViewMode] = useState(() => {
    try { return localStorage.getItem('kepco-view-mode') || 'viewer'; } catch(e) { return 'viewer'; }
  });
  const [curIdx, setCurIdx] = useState(() => {
    try { return parseInt(localStorage.getItem('kepco-cur-idx') || '0', 10) || 0; } catch(e) { return 0; }
  });
  const s = STYLES[styleKey];

  // Tweaks protocol
  useEffect(() => {
    const onMsg = (e) => {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode') setEditMode(true);
      if (d.type === '__deactivate_edit_mode') setEditMode(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  const [editMode, setEditMode] = useState(false);

  const setStyle = (k) => {
    setStyleKey(k);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { style: k } }, '*');
  };

  const goto = (i) => {
    const n = Math.max(0, Math.min(CARDS.length - 1, i));
    setCurIdx(n);
    try { localStorage.setItem('kepco-cur-idx', String(n)); } catch(e) {}
  };

  const setView = (v) => {
    setViewMode(v);
    try { localStorage.setItem('kepco-view-mode', v); } catch(e) {}
  };

  const toggleFullscreen = () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen?.();
    } else {
      document.exitFullscreen?.();
    }
  };

  // Keyboard nav in viewer mode
  useEffect(() => {
    if (viewMode !== 'viewer') return;
    const onKey = (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goto(curIdx + 1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); goto(curIdx - 1); }
      if (e.key === 'f' || e.key === 'F') { toggleFullscreen(); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [viewMode, curIdx]);

  // Page background tracks style for MZ dark
  useEffect(() => {
    document.body.style.background = styleKey === 'mz' ? '#05061A' : '#EEF1F6';
    document.querySelectorAll('.page-head h1, .page-head p').forEach(el => {
      el.style.color = styleKey === 'mz' ? '#F2F4FF' : '';
    });
  }, [styleKey]);

  const isMz = styleKey === 'mz';

  if (viewMode === 'viewer') {
    const card = CARDS[curIdx];
    const C = card.C;
    return (
      <>
        <div className="viewer-head">
          <div className="style-picker" style={{ background: isMz ? '#14162A' : '#fff', border: isMz ? '1px solid #2A2E4D' : '1px solid var(--line)' }}>
            {Object.entries(STYLES).map(([k, v]) => (
              <button key={k} className={k === styleKey ? 'active' : ''} onClick={() => setStyle(k)}
                style={{ background: k === styleKey ? (isMz ? v.accent : '#0d1826') : 'transparent', color: k === styleKey ? '#fff' : (isMz ? '#A6AEC8' : '#6b7a90') }}>
                {v.korName}
              </button>
            ))}
          </div>
          <div className="view-mode-toggle" style={{ background: isMz ? '#14162A' : '#fff', border: isMz ? '1px solid #2A2E4D' : '1px solid var(--line)' }}>
            <button className="active" style={{ background: isMz ? s.accent : '#0d1826', color: '#fff' }}>한 장씩</button>
            <button onClick={() => setView('grid')} style={{ color: isMz ? '#A6AEC8' : '#6b7a90' }}>전체 보기</button>
          </div>
          <button onClick={toggleFullscreen} title="전체화면 (F)" style={{ width: 40, height: 40, borderRadius: '50%', border: 'none', background: isMz ? '#14162A' : '#fff', color: isMz ? '#F2F4FF' : '#0d1826', cursor: 'pointer', fontSize: 18, boxShadow: '0 2px 10px rgba(10,30,70,0.08)', border: isMz ? '1px solid #2A2E4D' : '1px solid var(--line)' }}>⛶</button>
        </div>

        <div className="counter" style={{ background: isMz ? 'rgba(20,22,42,0.9)' : 'rgba(255,255,255,0.9)', color: isMz ? '#F2F4FF' : '#0d1826' }}>
          {curIdx + 1} / {CARDS.length}
        </div>

        <button className="nav-btn prev" onClick={() => goto(curIdx - 1)} disabled={curIdx === 0}
          style={{ background: isMz ? '#14162A' : '#fff', color: isMz ? '#F2F4FF' : '#0d1826' }} aria-label="이전">‹</button>
        <button className="nav-btn next" onClick={() => goto(curIdx + 1)} disabled={curIdx === CARDS.length - 1}
          style={{ background: isMz ? '#14162A' : '#fff', color: isMz ? '#F2F4FF' : '#0d1826' }} aria-label="다음">›</button>

        <div className="viewer" data-screen-label={card.n}>
          <div className="viewer-card-wrap">
            <div className="viewer-meta" style={{ color: isMz ? '#6b7a90' : '#8a99b1' }}>
              {card.n.toUpperCase()} {card.interactive && '· 👆 INTERACTIVE'}
            </div>
            <C s={s} />
          </div>
        </div>

        <div className="dots" style={{ background: isMz ? 'rgba(20,22,42,0.85)' : 'rgba(255,255,255,0.85)' }}>
          {CARDS.map((_, i) => (
            <button key={i} className={`dot ${i === curIdx ? 'active' : ''}`}
              style={{ background: i === curIdx ? (isMz ? s.accent : '#0d1826') : (isMz ? '#2A2E4D' : '#CBD3E0') }}
              onClick={() => goto(i)} aria-label={`${i + 1}번 카드로 이동`}/>
          ))}
        </div>

        <style>{`
          @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
          }
        `}</style>
      </>
    );
  }

  // Grid mode
  return (
    <>
      <div className="page-head">
        <div>
          <h1>한전 AI 카드뉴스 · {CARDS.length}장</h1>
          <p>전체 보기 모드입니다. 한 장씩 넘기려면 오른쪽 버튼을 눌러주세요.</p>
        </div>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center', flexWrap: 'wrap' }}>
          <div className="style-picker" style={{ background: isMz ? '#14162A' : '#fff', border: isMz ? '1px solid #2A2E4D' : '1px solid var(--line)' }}>
            {Object.entries(STYLES).map(([k, v]) => (
              <button key={k} className={k === styleKey ? 'active' : ''} onClick={() => setStyle(k)}
                style={{ background: k === styleKey ? (isMz ? v.accent : '#0d1826') : 'transparent', color: k === styleKey ? '#fff' : (isMz ? '#A6AEC8' : '#6b7a90') }}>
                {v.korName}
              </button>
            ))}
          </div>
          <div className="view-mode-toggle" style={{ background: isMz ? '#14162A' : '#fff', border: isMz ? '1px solid #2A2E4D' : '1px solid var(--line)' }}>
            <button onClick={() => setView('viewer')} style={{ color: isMz ? '#A6AEC8' : '#6b7a90' }}>한 장씩</button>
            <button className="active" style={{ background: isMz ? s.accent : '#0d1826', color: '#fff' }}>전체 보기</button>
          </div>
        </div>
      </div>

      <div className="grid">
        {CARDS.map((card, i) => {
          const C = card.C;
          return (
            <div key={i} className="card-wrap" data-screen-label={card.n}>
              <div className="card-num" style={{ color: isMz ? '#6b7a90' : '#8a99b1' }}>
                {card.n.toUpperCase()} {card.interactive && '· 👆 INTERACTIVE'}
              </div>
              <C s={s} />
            </div>
          );
        })}
      </div>

      <style>{`
        @keyframes pulse {
          0%, 100% { opacity: 0.3; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.2); }
        }
      `}</style>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
